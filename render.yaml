services:
  - type: web
    name: bridge-the-gap-api
    runtime: python
    region: singapore
    rootDir: apps/api
    # Free Render services run migrations during build; paid tiers can instead use preDeployCommand.
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
